{% extends "base.html" %}
{% block title %}Admin login · Pixelwave Radio{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="panel narrow"><p class="eyebrow">CONTROL ROOM</p><h1>Admin login</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Enter</button></form></section>
{% endblock %}
